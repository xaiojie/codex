version: "3.9"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex
      POSTGRES_DB: codex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://codex:codex@postgres:5432/codex
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: change_me_admin_token
      TIMEZONE_OFFSET: +08:00
      RPM_LIMIT: 60
      TPM_LIMIT: 60000
      UPSTREAM_BASE_URL: https://api.openai.com/v1
      UPSTREAM_API_KEY: your_upstream_key
      DEFAULT_MODEL: gpt-5.2-codex
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_ADMIN_TOKEN: change_me_admin_token
    depends_on:
      - backend
    ports:
      - "4173:4173"

volumes:
  postgres_data:
  redis_data:
